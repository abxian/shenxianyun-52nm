name: macOS Intel Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build, for example v2.5.28'
        required: true
        type: string
      reuse_release_assets:
        description: 'Republish existing Intel release assets without rebuilding'
        required: false
        default: false
        type: boolean

permissions: write-all

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0
  TARGET: x86_64-apple-darwin

jobs:
  build-macos-intel:
    name: Build macOS Intel
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify tag and version
        shell: bash
        run: |
          VERSION=$(jq -r .version package.json)
          if [ "${{ inputs.tag }}" != "v$VERSION" ]; then
            echo "::error::Tag ${{ inputs.tag }} does not match package version v$VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install Rust Stable
        if: ${{ !inputs.reuse_release_assets }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          targets: ${{ env.TARGET }}

      - name: Rust Cache
        if: ${{ !inputs.reuse_release_assets }}
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'v1-rust'
          key: 'rust-shared-stable-macos-15-intel-${{ env.TARGET }}'
          workspaces: |
            . -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Install pnpm
        if: ${{ !inputs.reuse_release_assets }}
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node
        if: ${{ !inputs.reuse_release_assets }}
        uses: actions/setup-node@v6
        with:
          node-version: '24.16.0'
          cache: 'pnpm'

      - name: Install Intel OpenSSL
        if: ${{ !inputs.reuse_release_assets }}
        shell: bash
        run: |
          brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "OPENSSL_INCLUDE_DIR=$(brew --prefix openssl@3)/include" >> "$GITHUB_ENV"
          echo "OPENSSL_LIB_DIR=$(brew --prefix openssl@3)/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install dependencies and sidecars
        if: ${{ !inputs.reuse_release_assets }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

          ALPHA_VERSION=$(curl --fail --silent --show-error --location \
            --retry 8 --retry-all-errors --retry-delay 10 \
            https://github.com/MetaCubeX/mihomo/releases/download/Prerelease-Alpha/version.txt)
          ALPHA_ARCHIVE="mihomo-darwin-amd64-v1-go122-${ALPHA_VERSION}.gz"
          ALPHA_SIDECAR="src-tauri/sidecar/verge-mihomo-alpha-${TARGET}"
          mkdir -p src-tauri/sidecar
          curl --fail --silent --show-error --location \
            --retry 8 --retry-all-errors --retry-delay 10 \
            "https://github.com/MetaCubeX/mihomo/releases/download/Prerelease-Alpha/$ALPHA_ARCHIVE" \
            -o "$RUNNER_TEMP/$ALPHA_ARCHIVE"
          gzip -dc "$RUNNER_TEMP/$ALPHA_ARCHIVE" > "$ALPHA_SIDECAR"
          chmod 755 "$ALPHA_SIDECAR"

          pnpm run prebuild "$TARGET"
          rustup target add "$TARGET" --toolchain 1.95.0

      - name: Build Intel bundles
        if: ${{ !inputs.reuse_release_assets }}
        shell: bash
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: pnpm build --target "$TARGET"

      - name: Verify bundle outputs
        if: ${{ !inputs.reuse_release_assets }}
        shell: bash
        run: |
          SOURCE_DMG=$(find "target/$TARGET/release/bundle/dmg" -name '*.dmg' -type f -print -quit)
          SOURCE_UPDATER=$(find "target/$TARGET/release/bundle/macos" -name '*.app.tar.gz' -type f -print -quit)
          SOURCE_SIG="$SOURCE_UPDATER.sig"
          test -n "$SOURCE_DMG" && test -f "$SOURCE_DMG"
          test -n "$SOURCE_UPDATER" && test -f "$SOURCE_UPDATER"
          test -f "$SOURCE_SIG"
          RELEASE_DIR="$RUNNER_TEMP/wuaiyun-intel-release"
          mkdir -p "$RELEASE_DIR"
          DMG="$RELEASE_DIR/Wuaiyun_${VERSION}_x64.dmg"
          UPDATER="$RELEASE_DIR/Wuaiyun.app.tar.gz"
          SIG="$UPDATER.sig"
          cp "$SOURCE_DMG" "$DMG"
          cp "$SOURCE_UPDATER" "$UPDATER"
          cp "$SOURCE_SIG" "$SIG"
          test "$(stat -f %z "$DMG")" -gt 10000000
          test "$(stat -f %z "$UPDATER")" -gt 10000000
          echo "DMG=$DMG" >> "$GITHUB_ENV"
          echo "UPDATER=$UPDATER" >> "$GITHUB_ENV"
          echo "SIG=$SIG" >> "$GITHUB_ENV"

      - name: Download existing Intel release assets
        if: ${{ inputs.reuse_release_assets }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="$RUNNER_TEMP/intel-release"
          mkdir -p "$BUNDLE_DIR"
          gh release download "${{ inputs.tag }}" --dir "$BUNDLE_DIR" --clobber \
            --pattern "Wuaiyun_${VERSION}_x64.dmg" \
            --pattern 'Wuaiyun.app.tar.gz' \
            --pattern 'Wuaiyun.app.tar.gz.sig'
          DMG="$BUNDLE_DIR/Wuaiyun_${VERSION}_x64.dmg"
          UPDATER="$BUNDLE_DIR/Wuaiyun.app.tar.gz"
          SIG="$UPDATER.sig"
          test "$(stat -f %z "$DMG")" -gt 10000000
          test "$(stat -f %z "$UPDATER")" -gt 10000000
          test -s "$SIG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"
          echo "UPDATER=$UPDATER" >> "$GITHUB_ENV"
          echo "SIG=$SIG" >> "$GITHUB_ENV"

      - name: Attest Intel bundles
        if: ${{ !inputs.reuse_release_assets }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ env.DMG }}
            ${{ env.UPDATER }}
            ${{ env.SIG }}

      - name: Upload to existing GitHub release
        if: ${{ !inputs.reuse_release_assets }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
          overwrite_files: true
          files: |
            ${{ env.DMG }}
            ${{ env.UPDATER }}
            ${{ env.SIG }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: wuaiyun-${{ env.VERSION }}-macos-intel
          path: |
            ${{ env.DMG }}
            ${{ env.UPDATER }}
            ${{ env.SIG }}
          if-no-files-found: error
