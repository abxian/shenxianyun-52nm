<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>神仙云圆形按钮隔离验证</title></head><body style="margin:0;background:linear-gradient(120deg,#e1e4fa,#94a8ef);color:#33406e;font-family:system-ui"><div id="root"></div><script type="module">
import React from 'react';

import {ThemeProvider,createTheme,CssBaseline,Box,Typography} from '@mui/material';
import {GlassPowerButton} from '/components/home/glass-power-button.tsx';
